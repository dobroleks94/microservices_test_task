spring:
  application:
    name: service-b
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
interceptor:
  header: "Authorization"
  tokenType: "Bearer"
server:
  port: 8030
management:
  endpoint:
    health:
      probes:
        enabled: true
